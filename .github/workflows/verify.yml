name: Verify Tunera

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javascript:
    name: TypeScript, lint and regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --ci

  native-dsp:
    name: Native DSP parity and capture cadence
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python3 tools/native-pitch/run.py test --download-deps

  android:
    name: Android release build and native regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: '1'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --include=dev --legacy-peer-deps --no-audit --no-fund
      - run: npx expo prebuild --platform android --no-install
      - name: Compile ARM release APK and run native tests
        working-directory: android
        run: >-
          ./gradlew :tunera-pitch:testReleaseUnitTest :app:assembleRelease
          --no-daemon --max-workers=2
          -Dorg.gradle.parallel=false
          -Dorg.gradle.jvmargs='-Xmx3g -XX:MaxMetaspaceSize=768m'
          -PreactNativeArchitectures=armeabi-v7a,arm64-v8a
